[project]
name = "stock-agent"
version = "0.1.0"
description = "AI Stock Recommendation Agent"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.8",
    "numpy>=2.2.6",
    "openbb>=4.7.1",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2>=2.9.12",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "python-jose>=3.5.0",
    "sentence-transformers>=5.3.0",
    "sqlalchemy>=2.0.49",
    "transformers>=5.5.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
