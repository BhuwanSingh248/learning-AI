name: RAG Evaluation Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "stock-agent/evaluation/**"
      - "stock-agent/tests/evaluation/**"
      - ".github/workflows/rag-evaluation.yml"
  push:
    branches: ["main"]
    paths:
      - "stock-agent/evaluation/**"
      - "stock-agent/tests/evaluation/**"
      - ".github/workflows/rag-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate golden dataset
        run: python evaluation/evaluate_rag.py --validate-only

      - name: Run evaluation unit tests
        run: pytest tests/evaluation/test_metrics.py -q
