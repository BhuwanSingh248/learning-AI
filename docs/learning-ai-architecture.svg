<rect width="1800" height="1180" fill="#fff"/>
<text x="900" y="48" text-anchor="middle" class="title">learning-AI — End-to-End Backend, RAG &amp; Agentic AI Architecture</text>
<text x="900" y="76" text-anchor="middle" class="sub">Online request flow + offline ingestion + evaluation + production platform</text>

<!-- top flow -->
<g transform="translate(35,105)">
